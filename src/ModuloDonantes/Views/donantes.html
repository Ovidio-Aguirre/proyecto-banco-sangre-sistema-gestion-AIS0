<section class="donantes">
    <h1 class="page-title">Donantes</h1>

    <div class="page-body">
        <div class="section-nav">
            <button class="page-button active" data-target="consultar">Consultar donantes</button>
            <button class="page-button" data-target="registrar">Registrar donante</button>
        </div>

        <div class="section-content">
            <section id="consultar" class="page-panel active">
                <div class="container">
                    <div id="donor-header">
                        <article class="filter-group">
                            <label for="buscar">Buscar por nombre o DUI</label>
                            <input type="text" name="buscar" id="buscar">
                        </article>
                        <article class="filter-group">
                            <label for="buscar-tipo">Tipo sanguineo</label>
                            <select name="id_tipo_sangre" id="buscar-tipo">
                                <option value="" disabled selected hidden>Todos</option>
                            </select>
                        </article>
                        <div class="filter-buttons">
                            <button class="main-button text">BUSCAR</button>
                            <button class="sec-button" data-target="registrar">+ NUEVO DONANTE</button>
                        </div>
                    </div>
                    <table class="table data-table" id="donor-table">
                        <thead>
                            <tr>
                                <th>DUI</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Contacto</th>
                                <th>Ultima donacion</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>

            <section id="registrar" class="page-panel">
                <form class="container" action="" method="POST">
                    <h3 class="title">Datos del donante</h3>
                    <input type="hidden" name="id_donante">
                    <div class="form-grid">

                        <article class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" name="nombre" id="nombre" maxlength="50" required>
                        </article>

                        <article class="form-group">
                            <label for="apellido">Apellido</label>
                            <input type="text" name="apellido" id="apellido" maxlength="50" required>
                        </article>

                        <article class="form-group">
                            <label for="dui">Documento de identidad (DUI)</label>
                            <input type="text" name="dui" id="dui" placeholder="00000000-0" maxlength="10" inputmode="numeric" required>
                        </article>

                        <article class="form-group">
                            <label for="contacto">Contacto</label>
                            <input type="tel" name="contacto" id="contacto" placeholder="0000-0000" maxlength="9" inputmode="numeric">
                        </article>

                        <article class="form-group">
                            <label for="nacimiento">Fecha de Nacimiento</label>
                            <input type="date" name="fecha_nacimiento" id="nacimiento" required>
                        </article>

                        <article class="form-group">
                            <label for="sexo">Sexo</label>
                            <select name="sexo" id="sexo" required>
                                <option value="" disabled selected hidden>Seleccione</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </article>

                        <article class="form-group">
                            <label for="tsangre">Tipo de Sangre</label>
                            <select name="id_tipo_sangre" id="tsangre" required>
                                <option value="" disabled selected hidden>Seleccione</option>
                            </select>
                        </article>

                        <div class="form-buttons">
                            <button type="submit" class="main-button">GUARDAR DONANTE</button>
                            <button type="button" class="sec-button" data-target="consultar">CANCELAR</button>
                        </div>

                    </div>
                </form>
            </section>

            <section id="historial" class="page-panel">
                <div class="container">
                    <h3 class="title">Historial del donante</h3>
                    <p class="text"><b>Donante:</b> <span id="hist-nombre"></span></p>
                    <p class="text"><b>DUI:</b> <span id="hist-dui"></span> &nbsp; <b>Tipo:</b> <span id="hist-tipo"></span></p>
                </div>

                <div class="container">
                    <h3 class="title">Evaluaciones</h3>
                    <table class="table data-table" id="eval-table">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Peso (kg)</th>
                                <th>Altura (m)</th>
                                <th>Resultado</th>
                                <th>Motivo</th>
                            </tr>
                        </thead>
                    </table>
                </div>

                <div class="container">
                    <h3 class="title">Donaciones</h3>
                    <table class="table data-table" id="don-hist-table">
                        <thead>
                            <tr>
                                <th>Codigo</th>
                                <th>Recoleccion</th>
                                <th>Caducidad</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                    </table>
                    <div class="form-buttons">
                        <button type="button" class="sec-button" data-target="consultar">VOLVER AL LISTADO</button>
                    </div>
                </div>
            </section>

        </div>
    </div>
</section>
