<section class="solicitudes">
    <h1 class="page-title">Solicitudes</h1>

    <div class="page-body">
        <div class="section-nav">
            <button class="page-button active" data-target="consultar">Consultar solicitudes</button>
            <button class="page-button" data-target="nueva">Nueva solicitud</button>
            <button class="page-button" data-target="historial">Historial de solicitudes</button>
        </div>

        <div class="section-content">
            <section id="consultar" class="page-panel active">
                <div class="container">
                    <div id="request-header">
                        <article class="filter-group">
                            <label for="buscar">Buscar por hospital o código</label>
                            <input type="text" name="buscar" id="buscar">
                        </article>
                        <article class="filter-group">
                            <label for="buscar-estado">Estado</label>
                            <select name="estado" id="buscar-estado">
                                <option value="" disabled selected hidden>Todos</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="Aprobada">Aprobada</option>
                                <option value="Rechazada">Rechazada</option>
                            </select>
                        </article>
                        <div class="filter-buttons">
                            <button class="main-button text">BUSCAR</button>
                            <button class="sec-button" data-target="nueva">+ NUEVA SOLICITUD</button>
                        </div>
                    </div>
                    <table class="table data-table" id="request-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Hospital</th>
                                <th>Tipo</th>
                                <th>Cantidad</th>
                                <th>Prioridad</th>
                                <th>Fecha requerida</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>

            <section id="nueva" class="page-panel">
                <form class="container" action="" method="POST">
                    <h3 class="title">Datos de la solicitud</h3>
                    <div class="form-grid">

                        <article class="form-group">
                            <label for="hospital">Hospital</label>
                            <select name="id_hospital" id="hospital" required>
                                <option value="" disabled selected hidden>Seleccione</option>
                            </select>
                        </article>

                        <article class="form-group">
                            <label for="tsangre">Tipo de Sangre</label>
                            <select name="id_tipo_sangre" id="tsangre" required>
                                <option value="" disabled selected hidden>Seleccione</option>
                            </select>
                        </article>
                        <article class="form-group">
                            <label for="cantidad">Cantidad de unidades</label>
                            <input type="number" name="cantidad" id="cantidad" min="1" required>
                        </article>

                        <article class="form-group">
                            <label for="prioridad">Prioridad</label>
                            <select name="prioridad" id="prioridad" required>
                                <option value="" disabled selected hidden>Seleccione</option>
                                <option value="Normal">Normal</option>
                                <option value="Urgente">Urgente</option>
                                <option value="Critica">Crítica</option>
                            </select>
                        </article>

                        <article class="form-group">
                            <label for="fecha-requerida">Fecha requerida</label>
                            <input type="date" name="fecha_requerida" id="fecha-requerida" required>
                        </article>

                        <article class="form-group">
                            <label for="medico">Médico solicitante</label>
                            <input type="text" name="medico" id="medico" required>
                        </article>

                        <article class="form-group">
                            <label for="observaciones">Observaciones</label>
                            <input type="text" name="observaciones" id="observaciones">
                        </article>

                        <div class="form-buttons">
                            <button type="submit" class="main-button">ENVIAR SOLICITUD</button>
                            <button type="button" class="sec-button" data-target="consultar">CANCELAR</button>
                        </div>

                    </div>
                </form>
            </section>

            <section id="historial" class="page-panel">
                <div class="container">
                    <div id="request-history-header">
                        <article class="filter-group">
                            <label for="desde">Desde</label>
                            <input type="date" name="desde" id="desde">
                        </article>
                        <article class="filter-group">
                            <label for="hasta">Hasta</label>
                            <input type="date" name="hasta" id="hasta">
                        </article>
                        <article class="filter-group">
                            <label for="historial-estado">Estado</label>
                            <select name="estado" id="historial-estado">
                                <option value="" disabled selected hidden>Todos</option>
                                <option value="Aprobada">Aprobada</option>
                                <option value="Rechazada">Rechazada</option>
                            </select>
                        </article>
                        <div class="filter-buttons">
                            <button class="main-button text">BUSCAR</button>
                        </div>
                    </div>
                    <table class="table data-table" id="request-history-table">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Fecha</th>
                                <th>Hospital</th>
                                <th>Tipo</th>
                                <th>Cantidad</th>
                                <th>Estado</th>
                                <th>Fecha de respuesta</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </section>

        </div>
    </div>

</section>
